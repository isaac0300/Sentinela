<!DOCTYPE html>
<html lang="pt-BR">

<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Painel Médico</title>

  <link rel="stylesheet" href="css/style.css">

  <style>
    .btn-tv {
      background: #28a745;
      color: white;
      border: none;
      padding: 8px 14px;
      border-radius: 5px;
      cursor: pointer;
      font-size: 14px;
      margin-top: 8px;
    }

    .btn-tv:hover {
      background: #1e7e34;
    }

    .btn-abrir-tv {
      width: auto;
      margin: 0;
      background: #17a2b8;
      padding: 8px 16px;
      border-radius: 5px;
      font-size: 14px;
    }

    .btn-abrir-tv:hover {
      background: #117a8b;
    }

    .btn-alta {
      background: #dc3545;
      color: white;
      border: none;
      padding: 8px 14px;
      border-radius: 5px;
      cursor: pointer;
      font-size: 14px;
      margin-top: 8px;
    }

    .btn-alta:hover {
      background: #c82333;
    }

    .consultorio-input {
      display: flex;
      align-items: center;
      gap: 10px;
      margin-bottom: 16px;
      padding: 10px 14px;
      background: #f0f4ff;
      border: 1px solid #d0d8f0;
      border-radius: 6px;
    }

    .consultorio-input label {
      font-weight: bold;
    }

    .consultorio-input input {
      width: 60px;
      padding: 4px 8px;
      text-align: center;
      font-size: 18px;
      font-weight: bold;
      border: 1px solid #ccc;
      border-radius: 4px;
    }

    .botoes-paciente {
      display: flex;
      gap: 8px;
      flex-wrap: wrap;
    }

    .botoes-paciente button {
      width: auto;
    }

    @media (max-width: 600px) {
      .consultorio-input {
        flex-wrap: wrap;
      }

      .consultorio-input span {
        width: 100%;
      }

      .botoes-paciente button {
        flex: 1;
      }
    }
  </style>
</head>

<body>

  <div class="container">

    <div style="display:flex; justify-content:space-between; align-items:center; margin-bottom:20px;">
      <h2 style="margin:0;">🩺 Painel Médico</h2>

      <button class="btn-abrir-tv" onclick="window.open('tv.html', '_blank')">
        📺 Abrir Tela da TV
      </button>
    </div>

    <div class="consultorio-input">
      <label>Meu Consultório:</label>

      <input
        type="text"
        id="consultorio-num"
        value="01"
      >

      <span style="color:#666; font-size:13px;">
        Este número será exibido na TV ao chamar o paciente.
      </span>
    </div>

    <div id="triagens"></div>

    <hr>

    <h3>Consulta</h3>

    <input
      id="paciente"
      placeholder="Paciente"
      readonly
    >

    <input
      id="diagnostico"
      placeholder="Diagnóstico"
    >

    <select id="medicacao">
      <option value="">Selecione a medicação</option>
    </select>

    <textarea
      id="obs"
      placeholder="Observações"
    ></textarea>

    <button onclick="salvar()">
      Salvar
    </button>

  </div>

  <script>
    let triagensCarregadas = [];

    // Carrega os pacientes aguardando atendimento
    function carregar() {
      fetch("/triagens")
        .then(r => r.json())
        .then(data => {
          triagensCarregadas = data.filter(
            t => t.status === "aguardando_medico"
          );

          const div = document.getElementById("triagens");
          div.innerHTML = "";

          if (triagensCarregadas.length === 0) {
            div.innerHTML = `
              <p style="color:#888; text-align:center;">
                Nenhum paciente na fila.
              </p>
            `;
            return;
          }

          triagensCarregadas.forEach((t, index) => {
            const nomeSeguro = String(t.nome || "")
              .replace(/\\/g, "\\\\")
              .replace(/'/g, "\\'");

            div.innerHTML += `
              <div class="card">
                <h3>${t.nome || "Paciente"}</h3>

                <p>
                  <b>Sintoma:</b>
                  ${t.sintoma || "Não informado"}
                </p>

                <p>
                  <b>Temperatura:</b>
                  ${t.temperatura || "Não informada"}°C
                </p>

                <p>
                  <span class="${t.risco || ""}">
                    ${t.risco || "Não informado"}
                  </span>
                </p>

                <p>
                  <b>Alergia:</b>
                  ${t.alergia || "Nenhuma"}
                </p>

                <p>
                  <b>Observação:</b>
                  ${t.observacao || "Nenhuma"}
                </p>

                <div class="botoes-paciente">
                  <button onclick="selecionar(${index})">
                    Atender
                  </button>

                  <button
                    class="btn-tv"
                    onclick="chamarNaTV('${nomeSeguro}')"
                  >
                    📺 Chamar na TV
                  </button>

                  <button
                    class="btn-alta"
                    onclick="abrirAlta(${t.id})"
                  >
                    🏥 Dar Alta
                  </button>
                </div>
              </div>
            `;
          });
        })
        .catch(error => {
          console.error("Erro ao carregar pacientes:", error);
        });
    }

    // Chama o paciente na TV
    function chamarNaTV(nome) {
      const consultorio =
        document.getElementById("consultorio-num").value || "01";

      fetch("/tv/chamar", {
        method: "POST",
        headers: {
          "Content-Type": "application/json"
        },
        body: JSON.stringify({
          localTipo: "CONSULTÓRIO",
          localNumero: consultorio,
          paciente: nome
        })
      })
        .then(r => r.json())
        .then(() => {
          alert(
            `✅ ${nome} foi chamado na TV para o Consultório ${consultorio}!`
          );
        })
        .catch(error => {
          console.error("Erro ao chamar paciente na TV:", error);
          alert("❌ Não foi possível chamar o paciente na TV.");
        });
    }

    // Abre a tela de alta do paciente
    function abrirAlta(id) {
      if (!id) {
        alert("❌ Não foi possível identificar o paciente.");
        return;
      }

      window.location.href =
        `alta.html?id=${encodeURIComponent(id)}`;
    }

    // Seleciona o paciente para atendimento
    function selecionar(index) {
      const paciente = triagensCarregadas[index];

      if (!paciente) {
        alert("Paciente não encontrado.");
        return;
      }

      document.getElementById("paciente").value =
        paciente.nome || "";

      document.getElementById("obs").value =
        paciente.observacao || "";

      if (
        paciente.alergia &&
        paciente.alergia !== "Nenhuma"
      ) {
        alert(
          "⚠️ Paciente possui alergia: " +
          paciente.alergia
        );
      }
    }

    // Carrega a lista de medicações
    function carregarMedicacoes() {
      fetch("/lista-medicacoes")
        .then(r => r.json())
        .then(data => {
          const select =
            document.getElementById("medicacao");

          select.innerHTML =
            '<option value="">Selecione a medicação</option>';

          data.forEach(med => {
            const option =
              document.createElement("option");

            option.value = med;
            option.textContent = med;

            select.appendChild(option);
          });
        })
        .catch(error => {
          console.error(
            "Erro ao carregar medicações:",
            error
          );
        });
    }

    // Salva a consulta
    function salvar() {
      const paciente =
        document.getElementById("paciente").value;

      const diagnostico =
        document.getElementById("diagnostico").value;

      const medicacao =
        document.getElementById("medicacao").value;

      const obs =
        document.getElementById("obs").value;

      if (!paciente) {
        alert(
          "Selecione um paciente clicando em Atender."
        );
        return;
      }

      if (!medicacao) {
        alert("Selecione uma medicação.");
        return;
      }

      fetch("/consulta", {
        method: "POST",
        headers: {
          "Content-Type": "application/json"
        },
        body: JSON.stringify({
          paciente,
          diagnostico,
          medicacao,
          obs
        })
      })
        .then(r => r.json())
        .then(() => {
          alert("Consulta salva");

          document.getElementById("diagnostico").value = "";
          document.getElementById("medicacao").value = "";
          document.getElementById("obs").value = "";
        })
        .catch(error => {
          console.error("Erro ao salvar consulta:", error);
          alert("❌ Erro ao salvar consulta.");
        });
    }

    // Inicialização
    carregar();
    carregarMedicacoes();

    // Atualiza a fila a cada 10 segundos
    setInterval(carregar, 10000);
  </script>

</body>

</html>
