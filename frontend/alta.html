<!DOCTYPE html>
<html lang="pt-BR">

<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Dar Alta - Health Vision</title>

  <link rel="stylesheet" href="css/style.css">

  <style>
    .alta-header {
      display: flex;
      align-items: center;
      justify-content: space-between;
      gap: 15px;
      margin-bottom: 25px;
      flex-wrap: wrap;
    }

    .alta-header h2 {
      margin: 0;
    }

    .btn-voltar {
      width: auto;
      margin: 0;
      padding: 10px 18px;
      background: #6c757d;
      border-radius: 8px;
    }

    .btn-voltar:hover {
      background: #545b62;
    }

    .paciente-info {
      padding: 20px;
      margin-bottom: 25px;
      background: linear-gradient(135deg, #eaf6fa, #f7fcfd);
      border: 1px solid #cce8f0;
      border-radius: 14px;
    }

    .paciente-info h3 {
      margin: 0 0 15px;
    }

    .paciente-info p {
      margin: 8px 0;
      color: #58717d;
    }

    .paciente-info strong {
      color: #315766;
    }

    .dados-clinicos {
      margin-top: 20px;
      padding-top: 15px;
      border-top: 1px solid #cce8f0;
    }

    .alta-form {
      margin-top: 20px;
    }

    .alta-form label {
      display: block;
      margin: 16px 0 6px;
      color: #315766;
      font-weight: 600;
    }

    .alta-form textarea {
      margin-top: 0;
      min-height: 130px;
    }

    .btn-confirmar-alta {
      margin-top: 25px;
      background: linear-gradient(135deg, #28a745, #218838);
    }

    .btn-confirmar-alta:hover {
      background: linear-gradient(135deg, #218838, #1e7e34);
    }

    .btn-confirmar-alta:disabled {
      opacity: 0.6;
      cursor: not-allowed;
      transform: none;
    }

    .mensagem {
      display: none;
      padding: 15px;
      margin-top: 20px;
      border-radius: 10px;
      text-align: center;
      font-weight: 600;
    }

    .mensagem.sucesso {
      display: block;
      background: #e4f7ef;
      color: #168457;
      border: 1px solid #b8e6d0;
    }

    .mensagem.erro {
      display: block;
      background: #fde8e9;
      color: #c0392b;
      border: 1px solid #f1c1c4;
    }

    .carregando {
      padding: 30px;
      text-align: center;
      color: #58717d;
    }

    @media (max-width: 600px) {
      .alta-header {
        align-items: stretch;
      }

      .btn-voltar {
        width: 100%;
      }
    }
  </style>
</head>

<body>

  <div class="container">

    <div class="alta-header">
      <h2>🏥 Alta do Paciente</h2>

      <button class="btn-voltar" onclick="voltarParaMedico()">
        ← Voltar
      </button>
    </div>

    <div id="carregando" class="carregando">
      Carregando informações do paciente...
    </div>

    <div id="conteudo" style="display: none;">

      <!-- Dados do paciente -->
      <div class="paciente-info">

        <h3>👤 Dados do paciente</h3>

        <p>
          <strong>Nome:</strong>
          <span id="nomePaciente">-</span>
        </p>

        <p>
          <strong>Data de nascimento:</strong>
          <span id="dataNascimento">-</span>
        </p>

        <p>
          <strong>Documento:</strong>
          <span id="documento">-</span>
        </p>

        <p>
          <strong>Alergia:</strong>
          <span id="alergia">-</span>
        </p>

        <div class="dados-clinicos">

          <p>
            <strong>Sintoma:</strong>
            <span id="sintoma">-</span>
          </p>

          <p>
            <strong>Temperatura:</strong>
            <span id="temperatura">-</span>
          </p>

          <p>
            <strong>Risco:</strong>
            <span id="risco">-</span>
          </p>

          <p>
            <strong>Observação da triagem:</strong>
            <span id="observacao">-</span>
          </p>

        </div>
      </div>

      <!-- Formulário da alta -->
      <div class="alta-form">

        <h3>📋 Informações da alta</h3>

        <label for="diagnosticoFinal">
          Diagnóstico final
        </label>

        <textarea
          id="diagnosticoFinal"
          placeholder="Informe o diagnóstico final do paciente..."
        ></textarea>

        <label for="orientacoes">
          Orientações ao paciente
        </label>

        <textarea
          id="orientacoes"
          placeholder="Informe os cuidados, recomendações e orientações para o paciente..."
        ></textarea>

        <label for="observacoesAlta">
          Observações da alta
        </label>

        <textarea
          id="observacoesAlta"
          placeholder="Digite outras observações importantes..."
        ></textarea>

        <button
          id="btnConfirmarAlta"
          class="btn-confirmar-alta"
          onclick="confirmarAlta()"
        >
          ✅ Confirmar Alta
        </button>

        <div id="mensagem" class="mensagem"></div>

      </div>
    </div>
  </div>

  <script>
    let pacienteId = null;
    let pacienteAtual = null;

    // Pega o ID do paciente pela URL
    function pegarIdDaUrl() {
      const parametros = new URLSearchParams(window.location.search);
      return parametros.get("id");
    }

    // Carrega os dados do paciente
    function carregarPaciente() {
      pacienteId = pegarIdDaUrl();

      if (!pacienteId) {
        mostrarErro("Nenhum paciente foi informado.");
        return;
      }

      fetch("/triagens")
        .then(response => {
          if (!response.ok) {
            throw new Error("Erro ao buscar pacientes.");
          }

          return response.json();
        })
        .then(triagens => {
          pacienteAtual = triagens.find(
            t => String(t.id) === String(pacienteId)
          );

          if (!pacienteAtual) {
            throw new Error("Paciente não encontrado.");
          }

          preencherPaciente(pacienteAtual);
        })
        .catch(error => {
          console.error(error);
          mostrarErro(
            error.message || "Não foi possível carregar o paciente."
          );
        });
    }

    // Preenche os dados do paciente na tela
    function preencherPaciente(paciente) {
      document.getElementById("nomePaciente").textContent =
        paciente.nome || "Não informado";

      document.getElementById("dataNascimento").textContent =
        paciente.dataNascimento || "Não informado";

      document.getElementById("documento").textContent =
        paciente.documento || paciente.cpf || "Não informado";

      document.getElementById("alergia").textContent =
        paciente.alergia || "Nenhuma";

      document.getElementById("sintoma").textContent =
        paciente.sintoma || "Não informado";

      document.getElementById("temperatura").textContent =
        paciente.temperatura
          ? paciente.temperatura + " °C"
          : "Não informada";

      document.getElementById("risco").textContent =
        paciente.risco || "Não informado";

      document.getElementById("observacao").textContent =
        paciente.observacao || "Nenhuma";

      document.getElementById("carregando").style.display = "none";
      document.getElementById("conteudo").style.display = "block";
    }

    // Salva a alta no servidor
    function confirmarAlta() {
      const diagnosticoFinal =
        document.getElementById("diagnosticoFinal").value.trim();

      const orientacoes =
        document.getElementById("orientacoes").value.trim();

      const observacoesAlta =
        document.getElementById("observacoesAlta").value.trim();

      if (!diagnosticoFinal) {
        alert("Informe o diagnóstico final.");
        document.getElementById("diagnosticoFinal").focus();
        return;
      }

      if (!orientacoes) {
        alert("Informe as orientações ao paciente.");
        document.getElementById("orientacoes").focus();
        return;
      }

      if (!pacienteId) {
        alert("Paciente não identificado.");
        return;
      }

      if (!confirm(
        "Deseja realmente dar alta para " +
        pacienteAtual.nome +
        "?"
      )) {
        return;
      }

      const botao = document.getElementById("btnConfirmarAlta");

      botao.disabled = true;
      botao.textContent = "⏳ Salvando alta...";

      fetch("/alta", {
        method: "POST",
        headers: {
          "Content-Type": "application/json"
        },
        body: JSON.stringify({
          id: pacienteId,
          diagnosticoFinal,
          orientacoes,
          observacoesAlta
        })
      })
        .then(response =>
          response.json().then(data => ({
            ok: response.ok,
            data
          }))
        )
        .then(resultado => {
          if (!resultado.ok) {
            throw new Error(
              resultado.data.erro || "Erro ao realizar alta."
            );
          }

          mostrarSucesso("✅ Alta realizada com sucesso!");

          botao.textContent = "✅ Alta Realizada";

          setTimeout(() => {
            window.location.href = "medico.html";
          }, 2000);
        })
        .catch(error => {
          console.error("Erro ao realizar alta:", error);

          botao.disabled = false;
          botao.textContent = "✅ Confirmar Alta";

          mostrarErro(
            error.message || "Não foi possível realizar a alta."
          );
        });
    }

    function mostrarSucesso(texto) {
      const mensagem = document.getElementById("mensagem");

      mensagem.className = "mensagem sucesso";
      mensagem.textContent = texto;
      mensagem.style.display = "block";
    }

    function mostrarErro(texto) {
      const mensagem = document.getElementById("mensagem");

      if (mensagem) {
        mensagem.className = "mensagem erro";
        mensagem.textContent = "❌ " + texto;
        mensagem.style.display = "block";
        return;
      }

      document.getElementById("carregando").innerHTML = `
        <div class="mensagem erro">
          ❌ ${texto}
        </div>
      `;
    }

    function voltarParaMedico() {
      window.location.href = "medico.html";
    }

    carregarPaciente();
  </script>

</body>

</html>
