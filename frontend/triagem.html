<!DOCTYPE html>
<html lang="pt-BR">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Triagem - Health Vision</title>
  <link rel="stylesheet" href="css/style.css">

  <style>
    /* BOTÕES */
    .btn-tv {
      background: #28a745;
      color: white;
      border: none;
      padding: 8px 14px;
      border-radius: 5px;
      cursor: pointer;
      font-size: 14px;
    }

    .btn-tv:hover {
      background: #1e7e34;
    }

    .btn-abrir-tv {
      display: inline-block;
      background: #17a2b8;
      color: white;
      padding: 8px 14px;
      border-radius: 5px;
      font-size: 14px;
      text-decoration: none;
      cursor: pointer;
      border: none;
    }

    .btn-abrir-tv:hover {
      background: #117a8b;
    }

    .btn-atender {
      background: #007bff;
      color: white;
      border: none;
      padding: 8px 14px;
      border-radius: 5px;
      cursor: pointer;
      font-size: 14px;
      margin-right: 5px;
    }

    .btn-atender:hover {
      background: #0056b3;
    }

    /* FILA DE PACIENTES */
    .pacientes-fila {
      margin-bottom: 30px;
      background: #f0f4ff;
      border-radius: 8px;
      padding: 16px;
      border: 1px solid #d0d8f0;
    }

    .pacientes-fila h3 {
      margin-top: 0;
      color: #333;
      display: flex;
      justify-content: space-between;
      align-items: center;
      gap: 10px;
    }

    .pacientes-fila h3 span {
      font-size: 13px;
      font-weight: normal;
      color: #666;
    }

    /* ITEM DO PACIENTE */
    .fila-item {
      background: white;
      border-radius: 8px;
      padding: 15px;
      margin-bottom: 12px;
      border: 1px solid #dce4ff;
      box-shadow: 0 2px 5px rgba(0, 0, 0, 0.05);
    }

    .fila-topo {
      display: flex;
      justify-content: space-between;
      align-items: center;
      gap: 15px;
      margin-bottom: 10px;
    }

    .fila-topo strong {
      font-size: 18px;
      color: #333;
    }

    .fila-acoes {
      display: flex;
      gap: 8px;
      flex-wrap: wrap;
    }

    /* DADOS DO PACIENTE */
    .dados-paciente {
      display: grid;
      grid-template-columns: repeat(auto-fit, minmax(220px, 1fr));
      gap: 8px;
      background: #f8f9fa;
      padding: 12px;
      border-radius: 6px;
      margin-top: 10px;
    }

    .dado {
      font-size: 13px;
      color: #555;
      padding: 4px;
    }

    .dado b {
      color: #333;
    }

    /* PACIENTE SELECIONADO */
    .dados-selecionados {
      background: #eef8ff;
      border: 1px solid #b8def2;
      border-radius: 8px;
      padding: 15px;
      margin-bottom: 20px;
    }

    .dados-selecionados h3 {
      margin-top: 0;
      color: #176b87;
    }

    .dados-grid {
      display: grid;
      grid-template-columns: repeat(auto-fit, minmax(220px, 1fr));
      gap: 10px;
    }

    .campo-info {
      background: white;
      padding: 10px;
      border-radius: 5px;
      border: 1px solid #ddd;
    }

    .campo-info small {
      display: block;
      color: #777;
      font-size: 11px;
      margin-bottom: 3px;
    }

    .campo-info strong {
      color: #333;
      word-break: break-word;
    }

    /* RESULTADO */
    #resultado {
      margin: 15px 0;
      padding: 12px;
      border-radius: 6px;
      font-weight: bold;
      text-align: center;
    }

    #resultado.verde {
      background: #d4edda;
      color: #155724;
      border: 1px solid #c3e6cb;
    }

    #resultado.amarelo {
      background: #fff3cd;
      color: #856404;
      border: 1px solid #ffeeba;
    }

    #resultado.vermelho {
      background: #f8d7da;
      color: #721c24;
      border: 1px solid #f5c6cb;
    }

    /* RESPONSIVO */
    @media (max-width: 700px) {
      .fila-topo {
        flex-direction: column;
        align-items: flex-start;
      }

      .pacientes-fila h3 {
        flex-direction: column;
        align-items: flex-start;
      }
    }
  </style>
</head>

<body>
  <div class="container">

    <!-- CABEÇALHO -->
    <div style="display:flex; justify-content:space-between; align-items:center; margin-bottom:20px; gap:10px;">
      <h2 style="margin:0;">🏥 Triagem Hospitalar</h2>
      <button class="btn-abrir-tv" onclick="window.open('tv.html','_blank')">
        📺 Abrir Tela da TV
      </button>
    </div>

    <!-- FILA DE PACIENTES -->
    <div class="pacientes-fila">
      <h3>
        <span style="font-size:18px; font-weight:bold; color:#333;">
          Pacientes Cadastrados no Atendimento
        </span>
        <span>Clique em "Atender" para abrir os dados do paciente</span>
      </h3>

      <div id="fila-pacientes">
        <p style="color:#888; text-align:center;">
          Carregando pacientes...
        </p>
      </div>

      <button
        onclick="carregarPacientes()"
        style="margin-top:8px; background:#6c757d; color:white; border:none; padding:6px 12px; border-radius:4px; cursor:pointer; font-size:13px;"
      >
        🔄 Atualizar lista
      </button>
    </div>

    <hr>

    <!-- DADOS DO PACIENTE SELECIONADO -->
    <div id="dados-selecionados" class="dados-selecionados" style="display:none;">
      <h3>👤 Paciente selecionado</h3>
      <div id="informacoes-paciente" class="dados-grid"></div>
    </div>

    <!-- FORMULÁRIO DE TRIAGEM -->
    <h3>Formulário de Triagem</h3>

    <input id="nome" placeholder="Nome do paciente" readonly>

    <select id="sintoma">
      <option value="">Selecione o sintoma</option>
      <option value="dor_leve">Dor leve</option>
      <option value="resfriado">Resfriado</option>
      <option value="coriza">Coriza</option>
      <option value="tosse">Tosse</option>
      <option value="febre">Febre</option>
      <option value="vomito">Vômito</option>
      <option value="diarreia">Diarreia</option>
      <option value="falta_ar_moderada">Falta de ar moderada</option>
      <option value="falta_ar_grave">Falta de ar grave</option>
      <option value="infarto">Suspeita de infarto</option>
      <option value="avc">Suspeita de AVC</option>
      <option value="convulsao">Convulsão</option>
      <option value="hemorragia">Hemorragia</option>
    </select>

    <input id="temp" type="number" step="0.1" placeholder="Temperatura">
    <input id="alergia" placeholder="Alergias">
    <textarea id="observacao" placeholder="Observações"></textarea>

    <div id="resultado"></div>

    <button onclick="salvar()">Salvar Triagem</button>
  </div>

  <script>
    let pacienteSelecionado = null;

    /* ESCAPAR HTML */
    function escaparHTML(valor) {
      if (valor === null || valor === undefined) return "";

      return String(valor)
        .replace(/&/g, "&amp;")
        .replace(/</g, "&lt;")
        .replace(/>/g, "&gt;")
        .replace(/"/g, "&quot;")
        .replace(/'/g, "&#039;");
    }

    /* FORMATAR DATA */
    function formatarData(data) {
      if (!data) return "Não informado";

      const partes = String(data).split("-");

      if (partes.length === 3) {
        return `${partes[2]}/${partes[1]}/${partes[0]}`;
      }

      return data;
    }

    /* CARREGAR PACIENTES */
    function carregarPacientes() {
      fetch("/pacientes")
        .then(response => {
          if (!response.ok) {
            throw new Error("Erro ao buscar pacientes.");
          }

          return response.json();
        })
        .then(pacientes => {
          const div = document.getElementById("fila-pacientes");

          const fila = pacientes.filter(
            paciente => paciente.status === "triagem"
          );

          if (fila.length === 0) {
            div.innerHTML = `
              <p style="color:#888; text-align:center; padding:15px;">
                Nenhum paciente aguardando triagem.
              </p>
            `;
            return;
          }

          div.innerHTML = "";

          fila.forEach(paciente => {
            const item = document.createElement("div");
            item.className = "fila-item";

            item.innerHTML = `
              <div class="fila-topo">
                <div>
                  <strong>${escaparHTML(paciente.nome)}</strong>
                </div>

                <div class="fila-acoes">
                  <button
                    class="btn-atender"
                    onclick="selecionarPaciente(${paciente.id})"
                  >
                    👤 Atender
                  </button>

                  <button
                    class="btn-tv"
                    onclick="chamarNaTV('${escaparHTML(paciente.nome)}')"
                  >
                    📺 Chamar na TV
                  </button>
                </div>
              </div>

              <div class="dados-paciente">
                <div class="dado">
                  <b>Documento:</b>
                  ${escaparHTML(paciente.documento || paciente.cpf || "Não informado")}
                </div>

                <div class="dado">
                  <b>Nascimento:</b>
                  ${formatarData(paciente.dataNascimento)}
                </div>

                <div class="dado">
                  <b>Sexo:</b>
                  ${escaparHTML(paciente.sexo || "Não informado")}
                </div>

                <div class="dado">
                  <b>Nome da mãe:</b>
                  ${escaparHTML(paciente.nomeMae || "Não informado")}
                </div>

                <div class="dado">
                  <b>Estado civil:</b>
                  ${escaparHTML(paciente.estadoCivil || "Não informado")}
                </div>

                <div class="dado">
                  <b>Endereço:</b>
                  ${escaparHTML(paciente.endereco || "Não informado")}
                </div>

                <div class="dado">
                  <b>Telefone:</b>
                  ${escaparHTML(paciente.telefone || "Não informado")}
                </div>

                <div class="dado">
                  <b>E-mail:</b>
                  ${escaparHTML(paciente.email || "Não informado")}
                </div>

                <div class="dado">
                  <b>Contato de emergência:</b>
                  ${escaparHTML(paciente.contatoEmergencia || "Não informado")}
                </div>

                <div class="dado">
                  <b>Telefone emergência:</b>
                  ${escaparHTML(paciente.telefoneEmergencia || "Não informado")}
                </div>

                <div class="dado">
                  <b>Tipo de atendimento:</b>
                  ${escaparHTML(paciente.tipo || "Não informado")}
                </div>
              </div>
            `;

            div.appendChild(item);
          });
        })
        .catch(error => {
          console.error(error);

          document.getElementById("fila-pacientes").innerHTML = `
            <p style="color:red; text-align:center;">
              Erro ao carregar pacientes.
            </p>
          `;
        });
    }

    /* SELECIONAR PACIENTE */
    function selecionarPaciente(id) {
      fetch("/pacientes")
        .then(response => response.json())
        .then(pacientes => {
          const paciente = pacientes.find(
            p => Number(p.id) === Number(id)
          );

          if (!paciente) {
            alert("Paciente não encontrado.");
            return;
          }

          pacienteSelecionado = paciente;

          document.getElementById("nome").value =
            paciente.nome || "";

          document.getElementById("alergia").value =
            paciente.alergia || "";

          const box = document.getElementById("dados-selecionados");
          const info = document.getElementById("informacoes-paciente");

          info.innerHTML = `
            <div class="campo-info">
              <small>Nome completo</small>
              <strong>${escaparHTML(paciente.nome || "Não informado")}</strong>
            </div>

            <div class="campo-info">
              <small>Documento</small>
              <strong>${escaparHTML(paciente.documento || paciente.cpf || "Não informado")}</strong>
            </div>

            <div class="campo-info">
              <small>Data de nascimento</small>
              <strong>${formatarData(paciente.dataNascimento)}</strong>
            </div>

            <div class="campo-info">
              <small>Sexo</small>
              <strong>${escaparHTML(paciente.sexo || "Não informado")}</strong>
            </div>

            <div class="campo-info">
              <small>Nome da mãe</small>
              <strong>${escaparHTML(paciente.nomeMae || "Não informado")}</strong>
            </div>

            <div class="campo-info">
              <small>Estado civil</small>
              <strong>${escaparHTML(paciente.estadoCivil || "Não informado")}</strong>
            </div>

            <div class="campo-info">
              <small>Endereço</small>
              <strong>${escaparHTML(paciente.endereco || "Não informado")}</strong>
            </div>

            <div class="campo-info">
              <small>Telefone</small>
              <strong>${escaparHTML(paciente.telefone || "Não informado")}</strong>
            </div>

            <div class="campo-info">
              <small>E-mail</small>
              <strong>${escaparHTML(paciente.email || "Não informado")}</strong>
            </div>

            <div class="campo-info">
              <small>Contato de emergência</small>
              <strong>${escaparHTML(paciente.contatoEmergencia || "Não informado")}</strong>
            </div>

            <div class="campo-info">
              <small>Telefone de emergência</small>
              <strong>${escaparHTML(paciente.telefoneEmergencia || "Não informado")}</strong>
            </div>

            <div class="campo-info">
              <small>Tipo de atendimento</small>
              <strong>${escaparHTML(paciente.tipo || "Não informado")}</strong>
            </div>
          `;

          box.style.display = "block";

          box.scrollIntoView({
            behavior: "smooth",
            block: "start"
          });
        })
        .catch(error => {
          console.error(error);
          alert("Erro ao selecionar paciente.");
        });
    }

    /* CHAMAR NA TV */
    function chamarNaTV(nome) {
      fetch("/tv/chamar", {
        method: "POST",
        headers: {
          "Content-Type": "application/json"
        },
        body: JSON.stringify({
          localTipo: "GUICHÊ",
          localNumero: "01",
          paciente: nome
        })
      })
        .then(response => {
          if (!response.ok) {
            throw new Error("Erro ao chamar paciente na TV.");
          }

          return response.json();
        })
        .then(() => {
          alert(`✅ ${nome} foi chamado na TV para o Guichê 01!`);
        })
        .catch(error => {
          console.error(error);
          alert("Não foi possível chamar o paciente na TV.");
        });
    }

    /* CLASSIFICAR RISCO */
    function classificarRisco(sintoma, temperatura) {
      const vermelhos = [
        "infarto",
        "avc",
        "convulsao",
        "hemorragia",
        "falta_ar_grave"
      ];

      const amarelos = [
        "febre",
        "vomito",
        "diarreia",
        "falta_ar_moderada"
      ];

      if (temperatura >= 39) return "vermelho";
      if (vermelhos.includes(sintoma)) return "vermelho";
      if (amarelos.includes(sintoma)) return "amarelo";

      return "verde";
    }

    /* SALVAR TRIAGEM */
    function salvar() {
      if (!pacienteSelecionado) {
        alert("Primeiro selecione um paciente da fila.");
        return;
      }

      const nome = document.getElementById("nome").value;
      const sintoma = document.getElementById("sintoma").value;
      const temperatura = Number(document.getElementById("temp").value);
      const alergia = document.getElementById("alergia").value;
      const observacao = document.getElementById("observacao").value;

      if (!sintoma) {
        alert("Selecione o sintoma do paciente.");
        return;
      }

      if (!temperatura) {
        alert("Informe a temperatura do paciente.");
        return;
      }

      const risco = classificarRisco(sintoma, temperatura);

      fetch("/triagem", {
        method: "POST",
        headers: {
          "Content-Type": "application/json"
        },
        body: JSON.stringify({
          pacienteId: pacienteSelecionado.id,
          nome: pacienteSelecionado.nome,
          documento: pacienteSelecionado.documento || pacienteSelecionado.cpf,
          cpf: pacienteSelecionado.cpf || pacienteSelecionado.documento,
          dataNascimento: pacienteSelecionado.dataNascimento,
          sexo: pacienteSelecionado.sexo,
          nomeMae: pacienteSelecionado.nomeMae,
          estadoCivil: pacienteSelecionado.estadoCivil,
          endereco: pacienteSelecionado.endereco,
          telefone: pacienteSelecionado.telefone,
          email: pacienteSelecionado.email,
          contatoEmergencia: pacienteSelecionado.contatoEmergencia,
          telefoneEmergencia: pacienteSelecionado.telefoneEmergencia,
          tipo: pacienteSelecionado.tipo,
          sintoma,
          temperatura,
          alergia,
          observacao,
          risco
        })
      })
        .then(response => {
          if (!response.ok) {
            throw new Error("Erro ao salvar triagem.");
          }

          return response.json();
        })
        .then(() => {
          const resultado = document.getElementById("resultado");

          resultado.className = risco;
          resultado.innerHTML =
            "Classificação: " + risco.toUpperCase();

          alert("✅ Triagem salva com sucesso!");

          document.getElementById("sintoma").value = "";
          document.getElementById("temp").value = "";
          document.getElementById("alergia").value = "";
          document.getElementById("observacao").value = "";
          document.getElementById("dados-selecionados").style.display = "none";
          document.getElementById("nome").value = "";

          pacienteSelecionado = null;

          carregarPacientes();
        })
        .catch(error => {
          console.error(error);
          alert("❌ Não foi possível salvar a triagem.");
        });
    }

    /* INICIALIZAÇÃO */
    carregarPacientes();

    setInterval(carregarPacientes, 10000);
  </script>
</body>
</html>
