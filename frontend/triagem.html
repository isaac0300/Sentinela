<!DOCTYPE html>
<html lang="pt-BR">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Triagem - Health Vision</title>
    <link rel="stylesheet" href="css/style.css">

    <style>
        .btn-tv,
        .btn-atender,
        .btn-abrir-tv {
            color: white;
            border: none;
            border-radius: 5px;
            padding: 8px 14px;
            cursor: pointer;
            font-size: 14px;
        }

        .btn-tv { background: #28a745; }
        .btn-tv:hover { background: #1e7e34; }

        .btn-atender { background: #007bff; }
        .btn-atender:hover { background: #0056b3; }

        .btn-abrir-tv {
            background: #17a2b8;
            text-decoration: none;
        }

        .btn-abrir-tv:hover { background: #117a8b; }

        .pacientes-fila {
            margin-bottom: 30px;
            padding: 16px;
            background: #f0f4ff;
            border: 1px solid #d0d8f0;
            border-radius: 8px;
        }

        .pacientes-fila h3 {
            margin-top: 0;
            color: #333;
            display: flex;
            justify-content: space-between;
            align-items: center;
            gap: 10px;
        }

        .pacientes-fila h3 span:last-child {
            font-size: 13px;
            font-weight: normal;
            color: #666;
        }

        .fila-item {
            background: white;
            border: 1px solid #dce4ff;
            border-radius: 8px;
            padding: 15px;
            margin-bottom: 12px;
            box-shadow: 0 2px 5px rgba(0,0,0,.05);
        }

        .fila-topo {
            display: flex;
            justify-content: space-between;
            align-items: center;
            gap: 15px;
            margin-bottom: 10px;
        }

        .fila-topo strong {
            font-size: 18px;
            color: #333;
        }

        .fila-acoes {
            display: flex;
            gap: 8px;
            flex-wrap: wrap;
        }

        .dados-paciente,
        .dados-grid {
            display: grid;
            grid-template-columns: repeat(auto-fit, minmax(220px, 1fr));
            gap: 8px;
        }

        .dados-paciente {
            background: #f8f9fa;
            padding: 12px;
            border-radius: 6px;
            margin-top: 10px;
        }

        .dado {
            font-size: 13px;
            color: #555;
            padding: 4px;
        }

        .dado b { color: #333; }

        .dados-selecionados {
            background: #eef8ff;
            border: 1px solid #b8def2;
            border-radius: 8px;
            padding: 15px;
            margin-bottom: 20px;
        }

        .dados-selecionados h3 {
            margin-top: 0;
            color: #176b87;
        }

        .dados-grid { gap: 10px; }

        .campo-info {
            background: white;
            padding: 10px;
            border-radius: 5px;
            border: 1px solid #ddd;
        }

        .campo-info small {
            display: block;
            color: #777;
            font-size: 11px;
            margin-bottom: 3px;
        }

        .campo-info strong {
            color: #333;
            word-break: break-word;
        }

        #resultado {
            display: none;
            margin: 15px 0;
            padding: 12px;
            border-radius: 6px;
            font-weight: bold;
            text-align: center;
        }

        #resultado.verde {
            display: block;
            background: #d4edda;
            color: #155724;
            border: 1px solid #c3e6cb;
        }

        #resultado.amarelo {
            display: block;
            background: #fff3cd;
            color: #856404;
            border: 1px solid #ffeeba;
        }

        #resultado.vermelho {
            display: block;
            background: #f8d7da;
            color: #721c24;
            border: 1px solid #f5c6cb;
        }

        .status-triagem {
            display: inline-block;
            margin-top: 5px;
            padding: 4px 8px;
            border-radius: 12px;
            background: #fff3cd;
            color: #856404;
            font-size: 12px;
            font-weight: bold;
        }

        @media (max-width: 700px) {
            .fila-topo,
            .pacientes-fila h3 {
                flex-direction: column;
                align-items: flex-start;
            }

            .fila-acoes,
            .fila-acoes button {
                width: 100%;
            }
        }
    </style>
</head>

<body>
<div class="container">

    <div style="display:flex;justify-content:space-between;align-items:center;margin-bottom:20px;gap:10px;">
        <h2 style="margin:0;">🏥 Triagem Hospitalar</h2>

        <button class="btn-abrir-tv" onclick="window.open('tv.html','_blank')">
            📺 Abrir Tela da TV
        </button>
    </div>

    <div class="pacientes-fila">
        <h3>
            <span>Pacientes Cadastrados no Atendimento</span>
            <span>Clique em "Atender" para abrir os dados do paciente</span>
        </h3>

        <div id="fila-pacientes">
            <p style="color:#888;text-align:center;">Carregando pacientes...</p>
        </div>

        <button
            onclick="carregarPacientes()"
            style="margin-top:8px;background:#6c757d;color:white;border:none;padding:6px 12px;border-radius:4px;cursor:pointer;font-size:13px;"
        >
            🔄 Atualizar lista
        </button>
    </div>

    <hr>

    <div id="dados-selecionados" class="dados-selecionados" style="display:none;">
        <h3>👤 Paciente selecionado</h3>
        <div id="informacoes-paciente" class="dados-grid"></div>
    </div>

    <h3>Formulário de Triagem</h3>

    <input id="nome" placeholder="Nome do paciente" readonly>

    <select id="sintoma">
        <option value="">Selecione o sintoma</option>
        <option value="dor_leve">Dor leve</option>
        <option value="resfriado">Resfriado</option>
        <option value="coriza">Coriza</option>
        <option value="tosse">Tosse</option>
        <option value="febre">Febre</option>
        <option value="vomito">Vômito</option>
        <option value="diarreia">Diarreia</option>
        <option value="falta_ar_moderada">Falta de ar moderada</option>
        <option value="falta_ar_grave">Falta de ar grave</option>
        <option value="infarto">Suspeita de infarto</option>
        <option value="avc">Suspeita de AVC</option>
        <option value="convulsao">Convulsão</option>
        <option value="hemorragia">Hemorragia</option>
    </select>

    <input id="temp" type="number" step="0.1" placeholder="Temperatura">
    <input id="alergia" placeholder="Alergias">
    <textarea id="observacao" placeholder="Observações"></textarea>

    <div id="resultado"></div>

    <button onclick="salvar()">Salvar Triagem</button>
</div>

<script>
let pacienteSelecionado = null;

const $ = id => document.getElementById(id);

function escaparHTML(valor) {
    if (valor == null) return "";
    return String(valor)
        .replace(/&/g, "&amp;")
        .replace(/</g, "&lt;")
        .replace(/>/g, "&gt;")
        .replace(/"/g, "&quot;")
        .replace(/'/g, "&#039;");
}

function formatarData(data) {
    if (!data) return "Não informado";

    const partes = String(data).split("-");
    return partes.length === 3
        ? `${partes[2]}/${partes[1]}/${partes[0]}`
        : data;
}

function carregarPacientes() {
    const div = $("fila-pacientes");

    div.innerHTML = `
        <p style="color:#007bff;text-align:center;padding:15px;">
            🔄 Buscando pacientes...
        </p>
    `;

    fetch("/pacientes")
        .then(response => {
            if (!response.ok) throw new Error(`Erro HTTP ${response.status}`);
            return response.json();
        })
        .then(pacientes => {
            if (!Array.isArray(pacientes)) {
                throw new Error("A API não retornou uma lista de pacientes.");
            }

            const fila = pacientes.filter(
                paciente => String(paciente.status).toLowerCase() === "triagem"
            );

            if (!fila.length) {
                div.innerHTML = `
                    <p style="color:#888;text-align:center;padding:15px;">
                        Nenhum paciente aguardando triagem.
                    </p>
                `;
                return;
            }

            div.innerHTML = "";

            fila.forEach(paciente => {
                const item = document.createElement("div");
                item.className = "fila-item";

                const nome = escaparHTML(
                    paciente.nome || "Paciente sem nome"
                );

                item.innerHTML = `
                    <div class="fila-topo">
                        <div>
                            <strong>${nome}</strong>
                            <div class="status-triagem">
                                🟡 Aguardando triagem
                            </div>
                        </div>

                        <div class="fila-acoes">
                            <button
                                class="btn-atender"
                                onclick="selecionarPaciente(${Number(paciente.id)})"
                            >
                                👤 Atender
                            </button>

                            <button
                                class="btn-tv"
                                onclick="chamarNaTV('${nome}')"
                            >
                                📺 Chamar na TV
                            </button>
                        </div>
                    </div>

                    <div class="dados-paciente">
                        ${criarDado("Documento", paciente.documento || paciente.cpf)}
                        ${criarDado("Nascimento", formatarData(paciente.dataNascimento))}
                        ${criarDado("Sexo", paciente.sexo)}
                        ${criarDado("Nome da mãe", paciente.nomeMae)}
                        ${criarDado("Estado civil", paciente.estadoCivil)}
                        ${criarDado("Endereço", paciente.endereco)}
                        ${criarDado("Telefone", paciente.telefone)}
                        ${criarDado("E-mail", paciente.email)}
                        ${criarDado("Contato de emergência", paciente.contatoEmergencia)}
                        ${criarDado("Telefone emergência", paciente.telefoneEmergencia)}
                        ${criarDado("Tipo de atendimento", paciente.tipo)}
                    </div>
                `;

                div.appendChild(item);
            });
        })
        .catch(error => {
            console.error("Erro ao carregar pacientes:", error);

            div.innerHTML = `
                <div style="background:#f8d7da;color:#721c24;padding:15px;border-radius:6px;text-align:center;">
                    <strong>❌ Erro ao carregar pacientes</strong><br><br>
                    ${escaparHTML(error.message)}
                </div>
            `;
        });
}

function criarDado(label, valor) {
    return `
        <div class="dado">
            <b>${label}:</b>
            ${escaparHTML(valor || "Não informado")}
        </div>
    `;
}

function criarCampoInfo(label, valor) {
    return `
        <div class="campo-info">
            <small>${label}</small>
            <strong>${escaparHTML(valor || "Não informado")}</strong>
        </div>
    `;
}

function selecionarPaciente(id) {
    fetch("/pacientes")
        .then(response => {
            if (!response.ok) throw new Error(`Erro HTTP ${response.status}`);
            return response.json();
        })
        .then(pacientes => {
            const paciente = pacientes.find(
                p => Number(p.id) === Number(id)
            );

            if (!paciente) {
                alert("Paciente não encontrado.");
                return;
            }

            pacienteSelecionado = paciente;

            $("nome").value = paciente.nome || "";
            $("alergia").value = paciente.alergia || "";

            $("informacoes-paciente").innerHTML = `
                ${criarCampoInfo("Nome completo", paciente.nome)}
                ${criarCampoInfo("Documento", paciente.documento || paciente.cpf)}
                ${criarCampoInfo("Data de nascimento", formatarData(paciente.dataNascimento))}
                ${criarCampoInfo("Sexo", paciente.sexo)}
                ${criarCampoInfo("Nome da mãe", paciente.nomeMae)}
                ${criarCampoInfo("Estado civil", paciente.estadoCivil)}
                ${criarCampoInfo("Endereço", paciente.endereco)}
                ${criarCampoInfo("Telefone", paciente.telefone)}
                ${criarCampoInfo("E-mail", paciente.email)}
                ${criarCampoInfo("Contato de emergência", paciente.contatoEmergencia)}
                ${criarCampoInfo("Telefone de emergência", paciente.telefoneEmergencia)}
                ${criarCampoInfo("Tipo de atendimento", paciente.tipo)}
            `;

            $("dados-selecionados").style.display = "block";

            $("resultado").className = "";
            $("resultado").style.display = "none";
            $("resultado").innerHTML = "";

            $("dados-selecionados").scrollIntoView({
                behavior: "smooth",
                block: "start"
            });
        })
        .catch(error => {
            console.error("Erro ao selecionar paciente:", error);
            alert("Erro ao selecionar paciente.");
        });
}

function chamarNaTV(nome) {
    fetch("/tv/chamar", {
        method: "POST",
        headers: { "Content-Type": "application/json" },
        body: JSON.stringify({
            localTipo: "GUICHÊ",
            localNumero: "01",
            paciente: nome
        })
    })
    .then(response => {
        if (!response.ok) throw new Error(`Erro HTTP ${response.status}`);
        return response.json();
    })
    .then(() => {
        alert(`✅ ${nome} foi chamado na TV para o Guichê 01!`);
    })
    .catch(error => {
        console.error("Erro ao chamar paciente na TV:", error);
        alert("❌ Não foi possível chamar o paciente na TV.");
    });
}

function classificarRisco(sintoma, temperatura) {
    const vermelhos = [
        "infarto",
        "avc",
        "convulsao",
        "hemorragia",
        "falta_ar_grave"
    ];

    const amarelos = [
        "febre",
        "vomito",
        "diarreia",
        "falta_ar_moderada"
    ];

    if (temperatura >= 39 || vermelhos.includes(sintoma)) {
        return "vermelho";
    }

    if (temperatura >= 38 || amarelos.includes(sintoma)) {
        return "amarelo";
    }

    return "verde";
}

function salvar() {
    if (!pacienteSelecionado) {
        alert("Primeiro selecione um paciente da fila.");
        return;
    }

    const sintoma = $("sintoma").value;
    const temperaturaTexto = $("temp").value;
    const alergia = $("alergia").value;
    const observacao = $("observacao").value;

    if (!sintoma) {
        alert("Selecione o sintoma do paciente.");
        return;
    }

    if (temperaturaTexto === "") {
        alert("Informe a temperatura do paciente.");
        return;
    }

    const temperatura = Number(temperaturaTexto);

    if (isNaN(temperatura)) {
        alert("Informe uma temperatura válida.");
        return;
    }

    const risco = classificarRisco(sintoma, temperatura);

    const dados = {
        pacienteId: pacienteSelecionado.id,
        nome: pacienteSelecionado.nome,
        documento: pacienteSelecionado.documento || pacienteSelecionado.cpf || null,
        cpf: pacienteSelecionado.cpf || pacienteSelecionado.documento || null,
        dataNascimento: pacienteSelecionado.dataNascimento,
        sexo: pacienteSelecionado.sexo,
        nomeMae: pacienteSelecionado.nomeMae,
        estadoCivil: pacienteSelecionado.estadoCivil,
        endereco: pacienteSelecionado.endereco,
        telefone: pacienteSelecionado.telefone,
        email: pacienteSelecionado.email,
        contatoEmergencia: pacienteSelecionado.contatoEmergencia,
        telefoneEmergencia: pacienteSelecionado.telefoneEmergencia,
        tipo: pacienteSelecionado.tipo,
        sintoma,
        temperatura,
        alergia,
        observacao,
        risco
    };

    fetch("/triagem", {
        method: "POST",
        headers: { "Content-Type": "application/json" },
        body: JSON.stringify(dados)
    })
    .then(response => {
        if (!response.ok) throw new Error(`Erro HTTP ${response.status}`);
        return response.json();
    })
    .then(data => {
        console.log("Triagem salva:", data);

        const resultado = $("resultado");
        resultado.className = risco;
        resultado.style.display = "block";
        resultado.textContent = `Classificação: ${risco.toUpperCase()}`;

        alert("✅ Triagem salva com sucesso!");

        $("sintoma").value = "";
        $("temp").value = "";
        $("alergia").value = "";
        $("observacao").value = "";
        $("nome").value = "";

        $("dados-selecionados").style.display = "none";

        pacienteSelecionado = null;

        carregarPacientes();
    })
    .catch(error => {
        console.error("Erro ao salvar triagem:", error);
        alert(
            "❌ Não foi possível salvar a triagem.\n\n" +
            error.message
        );
    });
}

carregarPacientes();
setInterval(carregarPacientes, 10000);
</script>
</body>
</html>
